
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h2 id="titulo">CADASTRO DE PRODUTOS</h2>

        <form id="formProduto">
            <input type="hidden" id="indice">

            <div class="linha">
                <label>Código:</label>
                <input type="text" id="codigo" readonly>
            </div>

            <div class="linha">
                <label>Produto:</label>
                <input type="text" id="produto"
                    placeholder="Nome do produto" required>
            </div>

            <div class="linha">
                <label>Descrição:</label>
                <textarea id="descricao"
                    placeholder="Descrição do produto" required></textarea>
            </div>

            <div class="linha">
                <label>Preço: R$</label>
                <input type="text" id="preco"
                    placeholder="0,00" required>
            </div>

            <div class="linha">
                <label>Foto:</label>
                <input type="text" id="foto"
                    placeholder="Ex: brownie" required>
            </div>

            <img id="preview" alt="Prévia do produto">

            <div class="botoes">
                <button type="submit" id="btnSalvar">
                    Cadastrar Produto
                </button>

                <button type="button" id="btnCancelar">
                    Cancelar
                </button>
            </div>
        </form>

        <section id="telaLista" hidden>
            <h2>LISTA DE PRODUTOS</h2>

            <button type="button" id="btnNovo">
                Cadastrar Produto
            </button>

            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Imagem</th>
                        <th>Produto</th>
                        <th>Descrição</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaProdutos"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
